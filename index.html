<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>추상전략게임 - Phoridae</title>
    <style>
        /* 외부 배경 색상 설정 */
        body {
            background-color: #222272;
            color: #ffffff;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* 게임 보드 컨테이너 및 좌표 레이아웃 */
        .game-container {
            display: grid;
            grid-template-columns: 30px 360px;
            grid-template-rows: 360px 30px;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        /* 세로 좌표 (a-f) */
        .rank-labels {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
        }

        /* 가로 좌표 (1-6) */
        .file-labels {
            grid-column: 2;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            margin-top: 5px;
        }

        /* 6x6 체스판 */
        .board {
            display: grid;
            grid-template-columns: repeat(6, 60px);
            grid-template-rows: repeat(6, 60px);
            border: 2px solid #ffffff;
        }

        /* 체스판 칸 색상 정의 */
        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        /* 흰 칸: 연한 청색 */
        .light {
            background-color: #add8e6; 
        }

        /* 검은 칸: 남색 */
        .dark {
            background-color: #000080;
        }

        /* 기물 스타일 (예시 텍스트 및 유니코드 아이콘) */
        .piece {
            font-size: 32px;
            user-select: none;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* 청 팀 기물 스타일 */
        .team-blue {
            color: #1e90ff;
            filter: drop-shadow(0px 0px 3px #fff);
        }

        /* 람 팀 기물 스타일 */
        .team-navy {
            color: #1a1a1a;
            filter: drop-shadow(0px 0px 3px #fff);
        }

        /* 수컷 기물의 문양 표식 예시 */
        .male-mark::after {
            content: '⚜';
            position: absolute;
            font-size: 12px;
            bottom: 2px;
            right: 2px;
            color: gold;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            padding: 1px;
        }

        /* 하단 설명글 영역 */
        .description-box {
            margin-top: 30px;
            max-width: 420px;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #add8e6;
            line-height: 1.6;
            font-size: 14px;
        }

        .description-box h2 {
            margin-top: 0;
            font-size: 18px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
        }

        .description-box ul {
            padding-left: 20px;
            margin: 10px 0 0 0;
        }
    </style>
</head>
<body>

    <h1>Phoridae (포리대)</h1>

    <div class="game-container">
        <!-- 세로 좌표 (청의 입장 기준: 앞이 a, 뒤가 f) -->
        <div class="rank-labels">
            <div>f</div>
            <div>e</div>
            <div>d</div>
            <div>c</div>
            <div>b</div>
            <div>a</div>
        </div>

        <!-- 6x6 보드판 (f열부터 a열 순서로 배치) -->
        <div class="board" id="board"></div>

        <!-- 가로 좌표 (왼쪽부터 1 ~ 6) -->
        <div class="file-labels">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
        </div>
    </div>

    <!-- 하단 설명글 상자 (예시) -->
    <div class="description-box">
        <h2>게임 규칙 및 기물 안내 (예시)</h2>
        <p><strong>Phoridae</strong>는 6x6 보드에서 진행되는 체스/장기 기반의 추상전략게임입니다.</p>
        <ul>
            <li><strong>람(Navy) 팀</strong>이 선공으로 시작합니다.</li>
            <li>상대의 <strong>수컷(M)</strong>을 잡거나, 상대에게 수컷 외의 기물이 남지 않게 하면 승리합니다.</li>
            <li>구더기(M), 번데기(P), 암컷(F), 수컷(M), 어린 수컷(Y) 등 고유의 성장 및 번식 규칙을 가집니다.</li>
        </ul>
    </div>

    <script>
        // 초기 예시 배치도 (이미지 기준 세팅)
        // 6x6 배열 (f1~f6이 index 0, a1~a6이 index 5)
        const initialBoard = [
            // f열 (청 팀 진영)
            [{type: 'F', team: 'blue'}, {type: 'F', team: 'blue', special: true}, {type: 'M', team: 'blue'}, {type: 'F', team: 'blue'}], 
            // e열
            [{type: 'M', team: 'blue'}, null, null, {type: 'M', team: 'blue'}],
            // d열
            [null, null, null, null],
            // c열
            [null, null, null, null],
            // b열
            [{type: 'M', team: 'navy'}, null, null, {type: 'M', team: 'navy'}],
            // a열 (람 팀 진영)
            [{type: 'F', team: 'navy'}, {type: 'F', team: 'navy'}, {type: 'F', team: 'navy', special: true}, {type: 'F', team: 'navy'}]
        ];

        const boardElement = document.getElementById('board');
        const ranks = ['f', 'e', 'd', 'c', 'b', 'a'];

        // 보드판 동적 생성
        for (let r = 0; r < 6; r++) {
            for (let c = 0; c < 6; c++) {
                const square = document.createElement('div');
                
                // 흰 칸(연한 청색)과 검은 칸(남색) 교차 배치
                const isLight = (r + c) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                square.dataset.coord = `${ranks[r]}${c + 1}`;

                // 이미지 예시 배치를 위한 데이터 매핑 변환 (양 끝 2칸씩 기물 배치 시각화)
                let pieceData = null;
                if (initialBoard[r]) {
                    if (c === 0) pieceData = initialBoard[r][0];
                    else if (c === 1) pieceData = initialBoard[r][1];
                    else if (c === 4) pieceData = initialBoard[r][2];
                    else if (c === 5) pieceData = initialBoard[r][3];
                }

                // 기물이 존재할 경우 HTML 추가
                if (pieceData) {
                    const pieceSquare = document.createElement('div');
                    pieceSquare.className = `piece team-${pieceData.team}`;
                    
                    // 기물 종류에 따른 임시 유니코드 문자 매핑 (이후 이미지로 교체 가능)
                    if (pieceData.type === 'M' && !pieceData.special) {
                        pieceSquare.innerText = '♟'; // 구더기(폰 모양)
                    } else if (pieceData.type === 'F') {
                        pieceSquare.innerText = '♝'; // 암컷/수컷(비숍 모양)
                        if (pieceData.special) {
                            pieceSquare.classList.add('male-mark'); // 수컷 구분 문양 추가
                        }
                    }
                    
                    square.appendChild(pieceSquare);
                }

                boardElement.appendChild(square);
            }
        }
    </script>
</body>
</html>
