<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>벼룩파리 (Phoridae)</title>
    <style>
        :root {
            --bg-color: #222272;
            --dark-square: #5b8c5a; /* 이미지의 남색/녹색조 어두운 칸 */
            --light-square: #e7e7cd; /* 이미지의 연한 청색/크림색 밝은 칸 */
            --navy-piece: #2d3748; /* 하단 람 진영 (어두운 색) */
            --blue-piece: #2b6cb0; /* 상단 청 진영 (푸른 색) */
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .status-panel {
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 8px;
        }

        /* 이미지 비율에 맞춘 4(가로) x 6(세로) 보드 */
        .board {
            display: grid;
            grid-template-columns: repeat(4, 90px);
            grid-template-rows: repeat(6, 90px);
            border: 6px solid #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border-radius: 4px;
        }

        .square {
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        /* 이미지와 동일한 체커판 패턴 */
        .square.light { background-color: var(--light-square); }
        .square.dark { background-color: var(--dark-square); }

        .square.selected {
            outline: 4px solid #ffeb3b;
            outline-offset: -4px;
            z-index: 10;
        }

        /* 임시 도형 기물 스타일 */
        .piece {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: #ffffff;
            box-shadow: 0 5px 8px rgba(0,0,0,0.4);
            border: 3px solid #ffffff;
            position: relative;
        }

        /* 진영별 색상 */
        .piece.team-blue { background-color: var(--blue-piece); }
        .piece.team-navy { background-color: var(--navy-piece); }

        /* 문양이 있는 수컷 표기용 스타일 */
        .piece.male::after {
            content: "⚜";
            font-size: 0.8rem;
            position: absolute;
            bottom: 2px;
            color: #ffd700;
        }

        .controls { margin-top: 20px; }
        button {
            padding: 10px 20px; font-size: 1rem; font-weight: bold;
            background-color: #ffffff; color: var(--bg-color);
            border: none; border-radius: 5px; cursor: pointer;
        }
        button:hover { background-color: #e0e0e0; }
    </style>
</head>
<body>

    <h1>벼룩파리 (Phoridae)</h1>
    <div class="status-panel" id="status">람(Navy)의 차례입니다 (선공)</div>

    <div class="board" id="board"></div>

    <div class="controls">
        <button id="pass-btn">4턴 주기 휴식(Pass)</button>
    </div>

    <script>
        // 6행 4열 보드 상태 배열 정의
        const boardState = Array(6).fill(null).map(() => Array(4).fill(null));
        const rowLabels = ['a', 'b', 'c', 'd', 'e', 'f'];

        function createPiece(type, team, isMale = false) {
            return { type, team, isMale, turnCount: 0 };
        }

        // --- 초기 배치 설정 (이미지 기준) ---
        // 청 진영 (Blue, 상단 0~1행)
        boardState[0][0] = createPiece('P', 'blue'); // 번데기
        boardState[0][1] = createPiece('M', 'blue', true); // 수컷 (문양)
        boardState[0][2] = createPiece('F', 'blue'); // 암컷
        boardState[0][3] = createPiece('P', 'blue'); // 번데기
        boardState[1][0] = createPiece('m', 'blue'); // 구더기
        boardState[1][3] = createPiece('m', 'blue'); // 구더기

        // 람 진영 (Navy, 하단 4~5행)
        boardState[4][0] = createPiece('m', 'navy'); // 구더기
        boardState[4][3] = createPiece('m', 'navy'); // 구더기
        boardState[5][0] = createPiece('P', 'navy'); // 번데기
        boardState[5][1] = createPiece('F', 'navy'); // 암컷
        boardState[5][2] = createPiece('M', 'navy', true); // 수컷 (문양)
        boardState[5][3] = createPiece('P', 'navy'); // 번데기

        let currentTurn = 'navy'; // 람(Navy) 선공
        let selectedSquare = null;

        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');

        function renderBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < 6; r++) {
                for (let c = 0; c < 4; c++) {
                    const square = document.createElement('div');
                    // 첫 칸(0,0)이 연한 색이 되도록 격자 구성
                    const isLight = (r + c) % 2 === 0;
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    
                    if (selectedSquare && selectedSquare.row === r && selectedSquare.col === c) {
                        square.classList.add('selected');
                    }

                    const piece = boardState[r][c];
                    if (piece) {
                        const pieceEl = document.createElement('div');
                        pieceEl.className = `piece team-${piece.team} ${piece.isMale ? 'male' : ''}`;
                        pieceEl.innerText = piece.type;
                        square.appendChild(pieceEl);
                    }

                    square.addEventListener('click', () => handleSquareClick(r, c));
                    boardEl.appendChild(square);
                }
            }
        }

        function handleSquareClick(r, c) {
            const piece = boardState[r][c];

            if (selectedSquare) {
                const fromPiece = boardState[selectedSquare.row][selectedSquare.col];
                
                if (piece && piece.team === currentTurn) {
                    selectedSquare = { row: r, col: c };
                    renderBoard();
                    return;
                }

                // 이동 실행 및 로그 출력 가능 위치
                console.log(`${fromPiece.team}: ${rowLabels[selectedSquare.row]}${selectedSquare.col+1} -> ${rowLabels[r]}${c+1}`);
                
                boardState[r][c] = fromPiece;
                boardState[selectedSquare.row][selectedSquare.col] = null;
                
                currentTurn = currentTurn === 'navy' ? 'blue' : 'navy';
                statusEl.innerText = `${currentTurn === 'navy' ? '람(Navy)' : '청(Blue)'}의 차례입니다`;
                selectedSquare = null;
                renderBoard();
            } else {
                if (piece && piece.team === currentTurn) {
                    selectedSquare = { row: r, col: c };
                    renderBoard();
                }
            }
        }

        document.getElementById('pass-btn').addEventListener('click', () => {
            currentTurn = currentTurn === 'navy' ? 'blue' : 'navy';
            statusEl.innerText = `${currentTurn === 'navy' ? '람(Navy)' : '청(Blue)'}의 차례입니다 (휴식 사용)`;
            selectedSquare = null;
            renderBoard();
        });

        renderBoard();
    </script>
</body>
</html>
