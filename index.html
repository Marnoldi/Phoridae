<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>벼룩파리 (Phoridae) - 규칙 엔진 적용</title>
    <style>
        :root {
            --bg-color: #222272;
            --dark-square: #5b8c5a;
            --light-square: #e7e7cd;
            --navy-piece: #2d3748;
            --blue-piece: #2b6cb0;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 { margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .status-panel {
            margin-bottom: 15px; font-size: 1.2rem; font-weight: bold;
            background: rgba(0, 0, 0, 0.4); padding: 10px 20px; border-radius: 8px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 90px);
            grid-template-rows: repeat(6, 90px);
            border: 6px solid #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border-radius: 4px;
        }

        .square {
            width: 90px; height: 90px;
            display: flex; align-items: center; justify-content: center;
            position: relative; cursor: pointer; user-select: none;
        }

        .square.light { background-color: var(--light-square); }
        .square.dark { background-color: var(--dark-square); }

        /* 상태 시각화 스타일 */
        .square.selected { outline: 4px solid #ffeb3b; outline-offset: -4px; z-index: 10; }
        .square.movable::after {
            content: ""; width: 24px; height: 24px; background-color: rgba(0, 255, 0, 0.5);
            border-radius: 50%; position: absolute; z-index: 5;
        }
        .square.attackable { outline: 4px solid #f44336; outline-offset: -4px; z-index: 10; }

        .piece {
            width: 70px; height: 70px; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.1rem; color: #ffffff;
            box-shadow: 0 5px 8px rgba(0,0,0,0.4); border: 3px solid #ffffff;
            position: relative; z-index: 6;
        }

        .piece.team-blue { background-color: var(--blue-piece); }
        .piece.team-navy { background-color: var(--navy-piece); }
        .piece.male::after { content: "⚜"; font-size: 0.8rem; position: absolute; bottom: 2px; color: #ffd700; }

        .controls { margin-top: 20px; }
        button {
            padding: 10px 20px; font-size: 1rem; font-weight: bold;
            background-color: #ffffff; color: var(--bg-color); border: none; border-radius: 5px; cursor: pointer;
        }
        button:hover { background-color: #e0e0e0; }
    </style>
</head>
<body>

    <h1>벼룩파리 (Phoridae)</h1>
    <div class="status-panel" id="status">람(Navy)의 차례입니다</div>

    <div class="board" id="board"></div>

    <div class="controls">
        <button id="pass-btn">4턴 주기 휴식(Pass)</button>
    </div>

    <script>
        const boardState = Array(6).fill(null).map(() => Array(4).fill(null));
        const rowLabels = ['a', 'b', 'c', 'd', 'e', 'f'];

        function createPiece(type, team, isMale = false) {
            // dir: 구더기 이동 방향 (blue는 아래로 +1, navy는 위로 -1 시작)
            let dir = (team === 'blue') ? 1 : -1;
            return { type, team, isMale, dir, ageTurns: 0 };
        }

        // 초기 세팅 (4x6 직사각형 보드 배치)
        boardState[0][0] = createPiece('P', 'blue');
        boardState[0][1] = createPiece('M', 'blue', true);
        boardState[0][2] = createPiece('F', 'blue');
        boardState[0][3] = createPiece('P', 'blue');
        boardState[1][0] = createPiece('m', 'blue');
        boardState[1][3] = createPiece('m', 'blue');

        boardState[4][0] = createPiece('m', 'navy');
        boardState[4][3] = createPiece('m', 'navy');
        boardState[5][0] = createPiece('P', 'navy');
        boardState[5][1] = createPiece('F', 'navy');
        boardState[5][2] = createPiece('M', 'navy', true);
        boardState[5][3] = createPiece('P', 'navy');

        let currentTurn = 'navy';
        let selectedSquare = null;
        let validMoves = []; // 현재 이동 가능한 좌표 목록 [{r, c}, ...]

        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');

        // 범위 체크 함수
        function inBounds(r, c) { return r >= 0 && r < 6 && c >= 0 && c < 4; }

        // 가장자리 검사 함수
        function isEdge(r, c) { return r === 0 || r === 5 || c === 0 || c === 3; }

        // --- 행마법 계산 엔진 ---
        function getValidMoves(r, c) {
            const piece = boardState[r][c];
            if (!piece) return [];
            const moves = [];

            // 1. 구더기 (m)
            if (piece.type === 'm') {
                let nextR = r + piece.dir;
                if (inBounds(nextR, c)) {
                    const target = boardState[nextR][c];
                    if (!target || target.team !== piece.team) moves.push({r: nextR, c: c});
                }
            }
            
            // 2. 번데기 (P)
            else if (piece.type === 'P') {
                const pMoves = [[1,1], [1,-1], [-1,1], [-1,-1]];
                pMoves.forEach(([dr, dc]) => {
                    let nr = r + dr, nc = c + dc;
                    if (inBounds(nr, nc)) {
                        const target = boardState[nr][nc];
                        if (!target || target.team !== piece.team) moves.push({r: nr, c: nc});
                    }
                });
            }

            // 3. 암컷 (F)
            else if (piece.type === 'F') {
                // 대각선 1칸 및 2칸 계산 (중간에 기물이 막고 있으면 뛰어넘을 수 없음)
                const diagDirs = [[1,1], [1,-1], [-1,1], [-1,-1]];
                diagDirs.forEach(([dr, dc]) => {
                    for (let step = 1; step <= 2; step++) {
                        let nr = r + dr * step, nc = c + dc * step;
                        if (!inBounds(nr, nc)) break;
                        const target = boardState[nr][nc];
                        if (!target) {
                            moves.push({r: nr, c: nc});
                        } else {
                            if (target.team !== piece.team) moves.push({r: nr, c: nc});
                            break; // 기물이 있으므로 2칸째는 진행 불가
                        }
                    }
                });
                // 특수 행마: 가장자리에 있을 때 앞/뒤 1칸
                if (isEdge(r, c)) {
                    [[1,0], [-1,0]].forEach(([dr, dc]) => {
                        let nr = r + dr, nc = c + dc;
                        if (inBounds(nr, nc)) {
                            const target = boardState[nr][nc];
                            if (!target || target.team !== piece.team) moves.push({r: nr, c: nc});
                        }
                    });
                }
            }

            // 4. 수컷 (M)
            else if (piece.type === 'M') {
                // 비숍 행마 (원하는 만큼 대각선 이동)
                const diagDirs = [[1,1], [1,-1], [-1,1], [-1,-1]];
                diagDirs.forEach(([dr, dc]) => {
                    let nr = r + dr, nc = c + dc;
                    while (inBounds(nr, nc)) {
                        const target = boardState[nr][nc];
                        if (!target) {
                            moves.push({r: nr, c: nc});
                        } else {
                            if (target.team !== piece.team) moves.push({r: nr, c: nc});
                            break;
                        }
                        nr += dr; nc += dc;
                    }
                });
                // 특수 행마: 가장자리에 있을 때 앞/뒤 1칸
                if (isEdge(r, c)) {
                    [[1,0], [-1,0]].forEach(([dr, dc]) => {
                        let nr = r + dr, nc = c + dc;
                        if (inBounds(nr, nc)) {
                            const target = boardState[nr][nc];
                            if (!target || target.team !== piece.team) moves.push({r: nr, c: nc});
                        }
                    });
                }
            }

            // 5. 어린 수컷 (Y)
            else if (piece.type === 'Y') {
                // 알필 행마 (대각선 2칸 뛰어넘기)
                const yMoves = [[2,2], [2,-2], [-2,2], [-2,-2]];
                yMoves.forEach(([dr, dc]) => {
                    let nr = r + dr, nc = c + dc;
                    if (inBounds(nr, nc)) {
                        const target = boardState[nr][nc];
                        if (!target || target.team !== piece.team) moves.push({r: nr, c: nc});
                    }
                });
                // *참고: '무리 효과' 보너스 움직임은 규칙 구체화 후 확장 가능 영역입니다.
            }

            return moves;
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < 6; r++) {
                for (let c = 0; c < 4; c++) {
                    const square = document.createElement('div');
                    const isLight = (r + c) % 2 === 0;
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    
                    if (selectedSquare && selectedSquare.row === r && selectedSquare.col === c) {
                        square.classList.add('selected');
                    }

                    // 이동 및 공격 가능 칸 클래스 부여
                    const isMovable = validMoves.some(m => m.r === r && m.c === c);
                    if (isMovable) {
                        if (boardState[r][c]) square.classList.add('attackable');
                        else square.classList.add('movable');
                    }

                    const piece = boardState[r][c];
                    if (piece) {
                        const pieceEl = document.createElement('div');
